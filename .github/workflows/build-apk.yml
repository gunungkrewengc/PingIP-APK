name: Build PingIP v4.6.1 Ultra-Slim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK Release (R8 Ultra-Slim)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan file APK
        run: |
          mkdir -p out
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" out/PingIP-v4.6.1-UltraSlim.apk
          ls -lh out/PingIP-v4.6.1-UltraSlim.apk

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PingIP-v4.6.1-UltraSlim-APK
          path: out/PingIP-v4.6.1-UltraSlim.apk
