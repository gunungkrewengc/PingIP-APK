name: Build PingIP APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Optimized Release APK (R8 Shrunk)
        run: gradle assembleRelease --no-daemon

      - name: Rename APK & Show Size
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/PingIP-v4.5.apk
          ls -lh release-apk/PingIP-v4.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingIP-v4.5-APK
          path: release-apk/PingIP-v4.5.apk
